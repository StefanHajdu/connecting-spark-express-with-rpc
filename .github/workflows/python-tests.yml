name: Python Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java (OpenJDK) for PySpark
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: web_api/package-lock.json

    - name: Install dependencies
      run: |
        cd spark_api && pip install -e .
        cd ../web_api && npm install

    - name: Start services
      run: |
        chmod +x start-backend.sh
        ./start-backend.sh &
        sleep 20

    - name: Run tests
      run: cd spark_api && pytest test/test_use_cases.py -v
      env:
        PYTHONPATH: ${{ github.workspace }}/spark_api/src

    - name: Stop services
      if: always()
      run: |
        [ -f spark_api.pid ] && kill $(cat spark_api.pid) || true
        [ -f web_api.pid ] && kill $(cat web_api.pid) || true