name: Python Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          cd spark_api && uv sync && uv pip install -e .
          cd ../service && uv sync && uv pip install -e .

      - name: Start services
        run: |
          chmod +x start-backend.sh
          ./start-backend.sh &
          sleep 40

      - name: Run tests for API
        run: cd service && uv run pytest tests/test_api.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}/service/

      - name: Run tests for use cases
        run: cd spark_api && uv run pytest tests/test_use_cases.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}/spark_api/src

      - name: Stop services
        if: always()
        run: |
          [ -f spark_api.pid ] && kill $(cat spark_api.pid) || true
          [ -f service.pid ] && kill $(cat service.pid) || true
