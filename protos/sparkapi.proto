syntax = "proto3";

package sparkapi;

service SparkApi {
    rpc createSession(NewSessionRequest) returns (NewSessionResponse) {}
    
    rpc previewDataset(PreviewDatasetRequest) returns (stream DatasetRowResponse) {}
    rpc summarizeDataset(SummarizeDatasetRequest) returns (PysparkGeneralResponse) {}
    rpc getParentSessionPlan(PlanRequest) returns (PlanResponse) {}
    rpc getRebuildStatus(RebuildStatusRequest) returns (RebuildStatusResponse) {}
    rpc rebuildSession(RebuildRequest) returns (PysparkTransformResponse) {}

    rpc loadsDataset(NewDatasetRequest) returns (PysparkGeneralResponse) {}
    rpc loadFromSession(DatasetFromSessionRequest) returns (PysparkTransformResponse) {}
    
    rpc addSql(SqlRequest) returns (PysparkTransformResponse) {}
}


// --- Responses ---

message NewSessionResponse {
    string id = 1;
    string session_server_pid = 2;
    string msg = 3;
}

message PysparkGeneralResponse {
    string session_id = 1;
    string msg = 2;
    string columns_json = 3;
    string schema_tree = 4;
    int32 num_rows = 5;
}

message PysparkTransformResponse {
    string session_id = 1;
    string msg = 2;
}

message DatasetRowResponse {
    string row_json = 1;
}

message PlanResponse {
    string id = 1;
    bytes plan_deque = 2;
}

message RebuildStatusResponse {
    string id = 1;
    bool rebuild_status = 2;
}


// --- Requests ---

message NewSessionRequest {
    string id = 1;
}

message NewDatasetRequest {
    string session_id = 1;
    string df_path = 2;
    string df_type = 3;
}

message PreviewDatasetRequest {
    string id = 1;
    int32 limit = 2;
}

message SummarizeDatasetRequest {
    string id = 1;
}

message SqlRequest {
    string session_id = 1;
    string node_id = 2;
    string previous_node_id = 3;
    string query_type = 4;
    string query = 5;
    string query_params_json = 6;
}

message DatasetFromSessionRequest {
    string session_id = 1;
    string input_id = 2;
}

message PlanRequest {
    string id = 1;
}

message RebuildRequest {
    string id = 1;
}

message RebuildStatusRequest {
    string id = 1;
}

