syntax = "proto3";

package sparkapi;

service SparkApi {
    rpc createSession(NewSessionRequest) returns (NewSessionResponse) {}
    
    rpc previewDataset(PreviewDatasetRequest) returns (stream RowStreamResponse) {}
    rpc summarizeDataset(SummarizeDatasetRequest) returns (SparkActionlResponse) {}
    rpc getSessionStatus(SessionStatusRequest) returns (StatusResponse) {}
    rpc rebuildSession(RebuildRequest) returns (SparkTransformResponse) {}

    rpc loadsDataset(LoadDatasetRequest) returns (SparkTransformResponse) {}
    rpc loadFromSession(LoadFromSessionRequest) returns (SparkTransformResponse) {}
    
    // filter node
    rpc create_FilterNode(FilterNodeRequest) returns (SparkTransformResponse) {}
    rpc edit_FilterNode(FilterNodeRequest) returns (SparkTransformResponse) {}
    
    // add column node
    rpc create_AddColumnNode(AddColumnNodeRequest) returns (SparkTransformResponse) {}
    rpc edit_AddColumnNode(AddColumnNodeRequest) returns (SparkTransformResponse) {}

    // join node
    rpc create_InputExtension_JoinNode(JoinInputExtensionRequest) returns (SparkTransformResponse) {}
    rpc edit_JoinNode(JoinRequest) returns (SparkTransformResponse) {}
    
    // all nodes
    rpc removeNode(NodeRemovalRequest) returns (SparkTransformResponse) {}
}


// --- Responses ---

message NewSessionResponse {
    string id = 1;
    string session_server_pid = 2;
    string msg = 3;
}

message PysparkGeneralResponse {
    string session_id = 1;
    string msg = 2;
    string columns_json = 3;
    string schema_tree = 4;
    int32 num_rows = 5;
}

message SparkActionlResponse {
    string session_id = 1;
    string msg = 2;
    string columns = 3;
    string schema = 4;
    int32 count = 5;
}

message PysparkTransformResponse {
    string session_id = 1;
    string msg = 2;
}

message SparkTransformResponse {
    string session_id = 1;
    string msg = 2;
}

message RowStreamResponse {
    string row_json = 1;
}

message StatusResponse {
    string session_id = 1;
    bool rebuild_recommendation = 2;
    string cause = 3;
}


// --- Requests ---

message NewSessionRequest {
    string id = 1;
}

message LoadDatasetRequest {
    string session_id = 1;
    string df_path = 2;
    string df_type = 3;
}

message PreviewDatasetRequest {
    string session_id = 1;
    string node_id = 2;
    int32 limit = 3;
}

message SummarizeDatasetRequest {
    string session_id = 1;
    string node_id = 2;
}

message FilterNodeRequest {
    string session_id = 1;
    string node_id = 2;
    string prev_node_id = 3;
    repeated string expressions = 4;
    string matching = 5;    // and, or, default=None
}

message AddColumnExpression {
    string expression = 1;
    string col_name = 2;
}

message AddColumnNodeRequest {
    string session_id = 1;
    string node_id = 2;
    string prev_node_id = 3;
    repeated AddColumnExpression expressions = 4;
}

message JoinInputExtensionRequest {
    string session_id = 1;
    string node_id = 2;
    string prev_node_id = 3;
    string input_type = 4;
    string input_pointer = 5;
}

message JoinRequest {
    string session_id = 1;
    string node_id = 2;
    string join_relation = 3;
    repeated string columns_to_keep = 4;
    repeated string columns_to_add = 5;
    string prefix_for_added_columns = 6;
    repeated string join_criteria = 7;
    string criteria_matching = 8;
}

message NodeRemovalRequest {
    string session_id = 1;
    string node_id = 2;
}

message LoadFromSessionRequest {
    string session_id = 1;
    string input_session_id = 2;
}

message RebuildRequest {
    string session_id = 1;
}

message SessionStatusRequest {
    string session_id = 1;
}

