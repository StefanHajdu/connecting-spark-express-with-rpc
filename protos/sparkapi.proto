syntax = "proto3";

package sparkapi;

service SparkApi {
    rpc createSession(NewSessionRequest) returns (NewSessionResponse) {}
    
    rpc previewDataset(PreviewDatasetRequest) returns (stream RowStreamResponse) {}
    rpc summarizeDataset(SummarizeDatasetRequest) returns (SparkActionlResponse) {}
    rpc getParentSessionPlan(PlanRequest) returns (PlanResponse) {}
    rpc getRebuildStatus(RebuildStatusRequest) returns (RebuildStatusResponse) {}
    rpc rebuildSession(RebuildRequest) returns (PysparkTransformResponse) {}

    rpc loadsDataset(LoadDatasetRequest) returns (SparkTransformResponse) {}
    rpc loadFromSession(LoadFromSessionRequest) returns (SparkTransformResponse) {}
    
    rpc addSql(SqlRequest) returns (PysparkTransformResponse) {}
    rpc editSql(SqlRequest) returns (PysparkTransformResponse) {}
    rpc removeSql(SqlRemovalRequest) returns (PysparkTransformResponse) {}
}


// --- Responses ---

message NewSessionResponse {
    string id = 1;
    string session_server_pid = 2;
    string msg = 3;
}

message PysparkGeneralResponse {
    string session_id = 1;
    string msg = 2;
    string columns_json = 3;
    string schema_tree = 4;
    int32 num_rows = 5;
}

message SparkActionlResponse {
    string session_id = 1;
    string msg = 2;
    string columns = 3;
    string schema = 4;
    int32 count = 5;
}

message PysparkTransformResponse {
    string session_id = 1;
    string msg = 2;
}

message SparkTransformResponse {
    string session_id = 1;
    string msg = 2;
    string schema = 3;
}

message RowStreamResponse {
    string row_json = 1;
}

message PlanResponse {
    string id = 1;
    bytes planner = 2;
}

message RebuildStatusResponse {
    string id = 1;
    bool rebuild_status = 2;
}


// --- Requests ---

message NewSessionRequest {
    string id = 1;
}

message LoadDatasetRequest {
    string session_id = 1;
    string df_path = 2;
    string df_type = 3;
}

message PreviewDatasetRequest {
    string session_id = 1;
    string node_id = 2;
    int32 limit = 3;
}

message SummarizeDatasetRequest {
    string session_id = 1;
    string node_id = 2;
}

message SqlRequest {
    string session_id = 1;
    string node_id = 2;
    string previous_node_id = 3;
    string query_type = 4;
    string query = 5;
    bool include_sql = 6;
    string query_params_json = 7;
}

message SqlRemovalRequest {
    string session_id = 1;
    string node_id = 2;
    bool temp = 3;
}

message LoadFromSessionRequest {
    string session_id = 1;
    string input_session_id = 2;
}

message PlanRequest {
    string id = 1;
}

message RebuildRequest {
    string session_id = 1;
}

message RebuildStatusRequest {
    string id = 1;
}

