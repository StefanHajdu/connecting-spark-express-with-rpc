syntax = "proto3";

package sparkapi;

service SparkApi {
    rpc loadSessions(Empty) returns (stream SessionResponse) {}
    rpc createSession(NewSessionRequest) returns (NewSessionResponse) {}
    rpc getSessionStatus(SessionStatusRequest) returns (StatusResponse) {}

    rpc previewDataset(PreviewDatasetRequest) returns (stream DatasetResponse) {}
    rpc summarizeDataset(SummarizeDatasetRequest) returns (SparkActionResponse) {}
    
    rpc submit_LoadDatasetNode(LoadDatasetNodeRequest) returns (stream SparkTransformResponse) {}
    rpc submit_AddColumnNode(AddColumnNodeRequest) returns (stream SparkTransformResponse) {}
    rpc toggleNode(NodeToggleRequest) returns (stream SparkTransformResponse) {}
    rpc removeNode(NodeRemovalRequest) returns (stream SparkTransformResponse) {}

    rpc submit_LoadFromSessionNode(LoadFromSessionNodeRequest) returns (SparkTransformResponse) {}
    rpc submit_FilterNode(FilterNodeRequest) returns (SparkTransformResponse) {}
    rpc submit_JoinNode(JoinNodeRequest) returns (SparkTransformResponse) {}
    rpc submit_TableNode(AddTableNodeRequest) returns (SparkTransformResponse) {}
    rpc submit_HistogramNode(AddHistogramNodeRequest) returns (SparkTransformResponse) {}
}


// --- Responses ---

message NewSessionResponse {
    string session_id = 1;
    string msg = 2;
}

message SparkActionResponse {
    string session_id = 1;
    string msg = 2;
    string columns = 3;
    string schema = 4;
    int32 count = 5;
}

message Column {
    string name = 1;
    string dtype = 2;
}

message InvalidState {
    bool active = 1;
    string error_msg = 2;
}

message SparkTransformResponse {
    string session_id = 1;
    string node_id = 2;
    string prev_node_id = 3;
    InvalidState invalid_state = 4;
    bool active = 5;
    repeated Column columns = 6;
    string title = 7;
    string user_input = 8;
}

message SessionResponse {
    string session_id = 1;
    string name = 2;
    repeated SparkTransformResponse nodes = 3;
}

message DatasetResponse {
    string data = 1;
}

message StatusResponse {
    string session_id = 1;
    bool rebuild_recommendation = 2;
    string cause = 3;
}


// --- Requests ---

message Empty {}


message NewSessionRequest {
    string session_id = 1;
    string name = 2;
}

message CsvInput {
    string delimiter = 1;
    bool include_header = 2;
    string path = 3;
    string kind = 4;
}

message JsonInput {
    bool multiline = 1;
    string path = 2;
    string kind = 3;
}

message ParquetInput {
    string path = 1;
    string kind = 2;
}

message LoadDatasetNodeRequest {
    string session_id = 1;
    oneof user_input {
        CsvInput csv = 2;
        JsonInput json = 3;
        ParquetInput parquet = 4;
    }
}

message SessionInput {
    string session_id = 1;
}


message PreviewDatasetRequest {
    string session_id = 1;
    string node_id = 2;
    int32 limit = 3;
}

message SummarizeDatasetRequest {
    string session_id = 1;
    string node_id = 2;
}

message FilterNodeRequest {
    string session_id = 1;
    string node_id = 2;
    string prev_node_id = 3;
    repeated string expressions = 4;
    string matching = 5;    // and, or, default=None
}

message AddTableNodeRequest {
    string session_id = 1;
    string node_id = 2;
    string prev_node_id = 3;
}

message AddHistogramNodeRequest {
    string session_id = 1;
    string node_id = 2;
    string prev_node_id = 3;
    string y_axis_col = 4;
    string order_by = 5;
    string sort_by = 6;
    string expression = 7;
}

message Arg {
    string name = 1;
    string custom_input = 2;
    string value_json = 3;
}

message Expression {
    string name = 1;
    repeated Arg args = 2;
    string compiled = 3;
}

message AddColumnExpression {
    Expression expression = 1;
    string new_column_name = 2;
}

message AddColumnNodeRequest {
    string session_id = 1;
    string node_id = 2;
    string prev_node_id = 3;
    repeated AddColumnExpression user_input = 4;
}

message JoinParams {
    string join_relation = 1;
    repeated string columns_to_keep = 2;
    repeated string columns_to_add = 3;
    string prefix_for_added_columns = 4;
    repeated string join_criteria = 5;
    string criteria_matching = 6;
}

message JoinNodeRequest {
    string session_id = 1;
    string node_id = 2;
    string prev_node_id = 3;
    oneof input_metadata {
        CsvInput csv = 4;
        JsonInput json = 5;
        ParquetInput parquet = 6;
        SessionInput session = 7;
    }
    JoinParams joinParams = 8;
}

message NodeRemovalRequest {
    string session_id = 1;
    string node_id = 2;
}

message NodeToggleRequest {
    string session_id = 1;
    string node_id = 2;
    bool toggle = 3;
}

message LoadFromSessionNodeRequest {
    string session_id = 1;
    string input_session_id = 2;
}

message SessionStatusRequest {
    string session_id = 1;
}

